#!/bin/bash

# Cores básicas ANSI (mantidas para compatibilidade)
export COLOR_RED='\033[0;31m'
export COLOR_GREEN='\033[0;32m'
export COLOR_YELLOW='\033[1;33m'
export COLOR_BLUE='\033[0;34m'
export COLOR_MAGENTA='\033[0;35m'
export COLOR_CYAN='\033[0;36m'
export COLOR_WHITE='\033[0;37m'
export COLOR_NC='\033[0m' # No Color

NOCTALIA_COLORS_FILE="${HOME}/.config/kitty/themes/noctalia.conf"

abort_colors() {
  local message="$1"
  echo "⚠️ $message" >&2
  if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    exit 1
  else
    return 1
  fi
}

if [ ! -f "$NOCTALIA_COLORS_FILE" ]; then
  abort_colors "Arquivo de cores '$NOCTALIA_COLORS_FILE' não encontrado."
fi

declare -A NOCTALIA_COLORS
while read -r line; do
  if [[ "$line" =~ ^[[:space:]]*([a-zA-Z0-9_]+)[[:space:]]+(#[0-9a-fA-F]{6})[[:space:]]*$ ]]; then
    NOCTALIA_COLORS["${BASH_REMATCH[1]}"]="${BASH_REMATCH[2]}"
  fi
done < "$NOCTALIA_COLORS_FILE"

get_color() {
  local key="$1"
  local default="$2"
  local value="${NOCTALIA_COLORS[$key]:-}"

  if [ -z "$value" ]; then
    value="$default"
  fi

  printf '%s\n' "$value"
}

# Cores carregadas do tema Kitty (com valores padrão)
export HEX_PRIMARY="$(get_color color3 '#c4b28a')"
export HEX_ON_PRIMARY="$(get_color background '#1f1f28')"
export HEX_PRIMARY_CONTAINER="$(get_color selection_background '#363646')"
export HEX_ON_PRIMARY_CONTAINER="$(get_color color7 '#c8c093')"

export HEX_SECONDARY="$(get_color color1 '#c4746e')"
export HEX_ON_SECONDARY="$(get_color background '#1f1f28')"
export HEX_SECONDARY_CONTAINER="$(get_color color9 '#cc928e')"
export HEX_ON_SECONDARY_CONTAINER="$(get_color background '#1f1f28')"

export HEX_TERTIARY="$(get_color color6 '#8ea49e')"
export HEX_ON_TERTIARY="$(get_color background '#1f1f28')"
export HEX_TERTIARY_CONTAINER="$(get_color color12 '#698a9b')"
export HEX_ON_TERTIARY_CONTAINER="$(get_color color7 '#c8c093')"

export HEX_ERROR="$(get_color color1 '#c4746e')"
export HEX_ON_ERROR="$(get_color background '#1f1f28')"
export HEX_ERROR_CONTAINER="$(get_color color9 '#cc928e')"
export HEX_ON_ERROR_CONTAINER="$(get_color background '#1f1f28')"

export HEX_SURFACE="$(get_color background '#1f1f28')"
export HEX_ON_SURFACE="$(get_color foreground '#dcd7ba')"
export HEX_SURFACE_VARIANT="$(get_color selection_background '#363646')"
export HEX_ON_SURFACE_VARIANT="$(get_color color8 '#aca9a4')"

export HEX_OUTLINE="$(get_color color8 '#aca9a4')"
export HEX_OUTLINE_VARIANT="$(get_color inactive_border_color '#2a2a37')"

export HEX_INVERSE_SURFACE="$(get_color foreground '#dcd7ba')"
export HEX_INVERSE_ON_SURFACE="$(get_color background '#1f1f28')"
export HEX_INVERSE_PRIMARY="$(get_color active_border_color '#c4b28a')"

# Estilos Gum predefinidos
export GUM_CONFIRM_PROMPT_FOREGROUND="$HEX_PRIMARY"
export GUM_CONFIRM_PROMPT_BOLD="true"

# Selected (opção selecionada - Yes/No quando está com foco)
export GUM_CONFIRM_SELECTED_FOREGROUND="$HEX_OUTLINE_VARIANT"
export GUM_CONFIRM_SELECTED_BACKGROUND="$HEX_SECONDARY"

# Unselected (opção NÃO selecionada)
export GUM_CONFIRM_UNSELECTED_FOREGROUND="$HEX_ON_SURFACE_VARIANT"
export GUM_CONFIRM_UNSELECTED_BACKGROUND="$HEX_SURFACE"

export GUM_SPIN_SPINNER='points'
export GUM_SPIN_TITLE_FOREGROUND="$HEX_SECONDARY"
export GUM_SPIN_SPINNER_FOREGROUND="$HEX_PRIMARY"

# Variáveis específicas para o script de atualização
export UPDATE_SUCCESS_COLOR="$HEX_TERTIARY"
export ERROR_COLOR="$HEX_ERROR"
export WARNING_COLOR="$HEX_ON_TERTIARY_CONTAINER"
export UPDATE_HEADER_COLOR="$HEX_SECONDARY"
export BORDER_COLOR="$HEX_OUTLINE_VARIANT"

export FOREGROUND="$HEX_PRIMARY"

# Border (Borda)
export BORDER="rounded" # none, hidden, normal, rounded, thick, double
export BORDER_FOREGROUND="$HEX_PRIMARY_CONTAINER"

# E outras opções de estilo também seguem esse padrão:
export BOLD="true"
export ALIGN="center"
export MARGIN="1 0"
export PADDING="1 2"
export WIDTH=50
