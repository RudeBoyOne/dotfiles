#!/bin/bash

# Cores básicas ANSI (mantidas para compatibilidade)
export COLOR_RED='\033[0;31m'
export COLOR_GREEN='\033[0;32m'
export COLOR_YELLOW='\033[1;33m'
export COLOR_BLUE='\033[0;34m'
export COLOR_MAGENTA='\033[0;35m'
export COLOR_CYAN='\033[0;36m'
export COLOR_WHITE='\033[0;37m'
export COLOR_NC='\033[0m' # No Color

NOCTALIA_COLORS_FILE="${HOME}/.config/noctalia/colors.json"

abort_colors() {
  local message="$1"
  echo "⚠️ $message" >&2
  if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    exit 1
  else
    return 1
  fi
}

if [ ! -f "$NOCTALIA_COLORS_FILE" ]; then
  abort_colors "Arquivo de cores '$NOCTALIA_COLORS_FILE' não encontrado."
fi

if ! command -v jq >/dev/null 2>&1; then
  abort_colors "Dependência 'jq' não encontrada. Instale-a para carregar as cores."
fi

declare -A NOCTALIA_COLORS
while IFS== read -r key value; do
  NOCTALIA_COLORS["$key"]="$value"
done < <(jq -r 'to_entries[] | select(.value != null) | "\(.key)=\(.value)"' "$NOCTALIA_COLORS_FILE")

get_color() {
  local key="$1"
  local default="$2"
  local value="${NOCTALIA_COLORS[$key]:-}"

  if [ -z "$value" ]; then
    value="$default"
  fi

  printf '%s\n' "$value"
}

# Cores Material You carregadas do JSON (com valores padrão legados)
export HEX_PRIMARY="$(get_color mPrimary '#ffb3ad')"
export HEX_ON_PRIMARY="$(get_color mOnPrimary '#68000a')"
export HEX_PRIMARY_CONTAINER="$(get_color mHover '#a7171f')"
export HEX_ON_PRIMARY_CONTAINER="$(get_color mOnHover '#fff6f4')"

export HEX_SECONDARY="$(get_color mSecondary '#ffb3ad')"
export HEX_ON_SECONDARY="$(get_color mOnSecondary '#5d1616')"
export HEX_SECONDARY_CONTAINER="$(get_color mSurfaceVariant '#7b2c2a')"
export HEX_ON_SECONDARY_CONTAINER="$(get_color mOnSurfaceVariant '#ffd7d3')"

export HEX_TERTIARY="$(get_color mTertiary '#90cdff')"
export HEX_ON_TERTIARY="$(get_color mOnTertiary '#003350')"
export HEX_TERTIARY_CONTAINER="$(get_color mSurface '#005986')"
export HEX_ON_TERTIARY_CONTAINER="$(get_color mOnSurface '#f3f8ff')"

export HEX_ERROR="$(get_color mError '#ffb4ab')"
export HEX_ON_ERROR="$(get_color mOnError '#690005')"
export HEX_ERROR_CONTAINER="$(get_color mError '#93000a')"
export HEX_ON_ERROR_CONTAINER="$(get_color mOnError '#ffdad6')"

export HEX_SURFACE="$(get_color mSurface '#1d100f')"
export HEX_ON_SURFACE="$(get_color mOnSurface '#f8dcda')"
export HEX_SURFACE_VARIANT="$(get_color mSurfaceVariant '#5a403e')"
export HEX_ON_SURFACE_VARIANT="$(get_color mOnSurfaceVariant '#e2bebb')"

export HEX_OUTLINE="$(get_color mOutline '#a98986')"
export HEX_OUTLINE_VARIANT="$(get_color mSurfaceVariant '#5a403e')"

export HEX_INVERSE_SURFACE="$(get_color mOnSurface '#f8dcda')"
export HEX_INVERSE_ON_SURFACE="$(get_color mSurface '#3d2c2b')"
export HEX_INVERSE_PRIMARY="$(get_color mSecondary '#b62328')"

# Estilos Gum predefinidos
export GUM_CONFIRM_PROMPT_FOREGROUND="$HEX_PRIMARY"
export GUM_CONFIRM_PROMPT_BOLD="true"

# Selected (opção selecionada - Yes/No quando está com foco)
export GUM_CONFIRM_SELECTED_FOREGROUND="$HEX_OUTLINE_VARIANT"
export GUM_CONFIRM_SELECTED_BACKGROUND="$HEX_SECONDARY"

# Unselected (opção NÃO selecionada)
export GUM_CONFIRM_UNSELECTED_FOREGROUND="$HEX_ON_SURFACE_VARIANT"
export GUM_CONFIRM_UNSELECTED_BACKGROUND="$HEX_SURFACE"

export GUM_SPIN_SPINNER='points'
export GUM_SPIN_TITLE_FOREGROUND="$HEX_SECONDARY"
export GUM_SPIN_SPINNER_FOREGROUND="$HEX_PRIMARY"

# Variáveis específicas para o script de atualização
export UPDATE_SUCCESS_COLOR="$HEX_TERTIARY"
export ERROR_COLOR="$HEX_ERROR"
export WARNING_COLOR="$HEX_ON_TERTIARY_CONTAINER"
export UPDATE_HEADER_COLOR="$HEX_SECONDARY"
export BORDER_COLOR="$HEX_OUTLINE_VARIANT"

export FOREGROUND="$HEX_PRIMARY"

# Border (Borda)
export BORDER="rounded" # none, hidden, normal, rounded, thick, double
export BORDER_FOREGROUND="$HEX_PRIMARY_CONTAINER"

# E outras opções de estilo também seguem esse padrão:
export BOLD="true"
export ALIGN="center"
export MARGIN="1 0"
export PADDING="1 2"
export WIDTH=50
