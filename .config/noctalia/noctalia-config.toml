[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.4999999888241291
capsule_radius = 7
center = []
end = [ "media", "privacy", "widget", "group:g2", "group:g1", "clock", "notifications", "tray" ]
font_weight = 600
margin_ends = 0
padding = 10
start = [ "workspaces" ]
thickness = 30

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "output_volume", "input_volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "sysmon", "cpu", "temp" ]
    opacity = 1.0
    padding = 6.0

[control_center]
hidden_tabs = [ "monitor", "power" ]
show_session_button = false
sidebar = "full"
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "keyboard_layout"

    [[control_center.shortcuts]]
    type = "notification"

[location]
address = "São Paulo"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
offset_x = 10

[osd]
offset_y = 50
position = "bottom_center"

[plugin_settings."yuuto/arch-updater"]
aur_helper = "yay"
auto_check_hours = 1
panel_placement = "floating"

[plugins]
enabled = [ "yuuto/arch-updater" ]

[shell]
font_family = "SF Pro"
panel_anchor_bar = "default"
polkit_agent = true

    [shell.animation]
    speed = 0.70000001043081284

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "top_left"
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "center_left"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screen_corners]
    enabled = true
    size = 25

    [shell.screenshot]
    confirm_region = true
    save_to_file = false

    [shell.session]
    grid = true
    grid_columns = 1
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

[theme]
community_palette = "Kanagawa Paper"
pure_black_dark = true
source = "community"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt", "starship" ]
    community_ids = [ "zen-browser", "telegram", "vscode", "vicinae", "hyprtoolkit", "yazi" ]

[wallpaper]
directory = "/home/lucas/.local/share/wallpapers"

    [wallpaper.default]
    path = "/home/lucas/.local/share/wallpapers/wallpapers/wallpapers/poseidon/johnny-africa-_ZX0S27D3fw-unsplash.jpg"

    [wallpaper.last]
    path = "/home/lucas/.local/share/wallpapers/wallpapers/wallpapers/poseidon/johnny-africa-_ZX0S27D3fw-unsplash.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/lucas/.local/share/wallpapers/wallpapers/wallpapers/poseidon/johnny-africa-_ZX0S27D3fw-unsplash.jpg"

[widget.clock]
format = "{:%d %b %Y - %H:%M}"

[widget.media]
hide_when_no_media = true

[widget.notifications]
hide_when_no_unread = true

[widget.privacy]
hide_inactive = true

[widget.sysmon]
stat = "ram_pct"

[widget.tray]
capsule = true
capsule_fill = "outline"

[widget.widget]
hide_on_empty = true
type = "yuuto/arch-updater:widget"
